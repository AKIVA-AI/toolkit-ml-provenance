[build-system]
requires = ["setuptools>=77,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toolkit-ml-provenance"
version = "1.0.0"
description = "AI-BOM in one command: CycloneDX 1.6 ML-BOMs, unsafe-pickle scanning, OpenSSF model signing and DSSE/Sigstore file signing for ML models."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AKIVA AI, LLC" }]
keywords = ["ml", "sbom", "aibom", "mlbom", "cyclonedx", "provenance", "sigstore", "model-signing", "pickle", "supply-chain"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/AKIVA-AI/toolkit-ml-provenance"
Documentation = "https://github.com/AKIVA-AI/toolkit-ml-provenance#readme"
Repository = "https://github.com/AKIVA-AI/toolkit-ml-provenance"
Issues = "https://github.com/AKIVA-AI/toolkit-ml-provenance/issues"
Changelog = "https://github.com/AKIVA-AI/toolkit-ml-provenance/blob/main/CHANGELOG.md"

[project.scripts]
toolkit-mlsbom = "toolkit_ml_sbom.cli:main"

[project.optional-dependencies]
signing = [
  "cryptography>=43.0.0",
]
sigstore = [
  "cryptography>=43.0.0",
  "sigstore>=4.0,<5",
]
oms = [
  "model-signing>=1.0,<2",
]
hf = [
  "huggingface_hub>=0.23",
  "pyyaml>=6.0",
]
mlflow = [
  "pyyaml>=6.0",
]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "ruff>=0.6.0",
  "pyright>=1.1.380",
  "cryptography>=43.0.0",
  "jsonschema>=4.18.0",
  "pyyaml>=6.0",
  "huggingface_hub>=0.23",
  "picklescan>=0.0.30; python_version >= '3.11'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "network: needs network access (skipped offline unless MLSBOM_REQUIRE_NETWORK=1)",
]

[tool.coverage.run]
branch = true
source = ["toolkit_ml_sbom"]
omit = ["*/toolkit_ml_sbom/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["toolkit_ml_sbom"]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
toolkit_ml_sbom = ["py.typed"]
